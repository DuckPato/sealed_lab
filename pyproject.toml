[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sealed_lab"
dynamic = ["version"]                  # sealed_lab.__version__ (the release tag must match it)
description = "17lands-based Sealed deck strength model, builder and scorer"
requires-python = ">=3.12"
dependencies = [
  "polars>=2.1",
  "pyarrow>=15",
  "numpy>=1.26",
  "scipy>=1.11",
  "PySide6>=6.6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "joblib>=1.3"]

[tool.setuptools.dynamic]
version = {attr = "sealed_lab.__version__"}

[tool.setuptools.packages.find]
include = ["sealed_lab*"]

[tool.uv]
# The app runs from its folder (`python -m sealed_lab`, shortcuts set the working directory); uv only manages .venv from uv.lock.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
