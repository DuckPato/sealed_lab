# Push a tag vX.Y.Z (matching sealed_lab.__version__) to test the app on Windows and Ubuntu and publish the release zip that the app's
# updater downloads. Pushes to main and pull requests only run the tests.
name: test-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # create the release

concurrency:                 # a newer push to the same branch / tag cancels the run still going
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      SEALED_LAB_NO_UPDATE_CHECK: "1"
      SEALED_LAB_NO_DATASET_CHECK: "1"
      PYTHONFAULTHANDLER: "1"
      SEALED_LAB_QUICK_TESTS: "1"      # skip the model-fitting tests (over an hour on a runner); run the full suite locally before a tag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Qt system libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Install (exact versions from uv.lock)
        run: uv sync --frozen --extra dev
      - name: Tests
        timeout-minutes: 25
        # one line per test (-v) and the stacks of all threads when a single test runs over 5 minutes: a hang names itself
        run: uv run --frozen --no-sync python -m pytest -v -p no:cacheprovider -o faulthandler_timeout=300 --durations=25

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release zip
        run: python tools/export_public.py --zip dist --tag "${{ github.ref_name }}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/sealed_lab-$ver.zip" --title "sealed_lab $ver" --generate-notes
